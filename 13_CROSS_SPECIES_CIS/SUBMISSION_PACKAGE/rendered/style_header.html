<style>
  @page { size: A4; margin: 0; }
  html { font-size: 11pt; }
  body {
    font-family: "Georgia", "Times New Roman", "DejaVu Serif", serif;
    line-height: 1.45; color: #111; max-width: 178mm;
    margin: 0; padding: 16mm 14mm;
    text-align: justify; hyphens: auto;
  }
  h1 { font-size: 1.45em; line-height: 1.25; margin: 0.6em 0 0.4em;
       text-align: left; page-break-after: avoid; }
  h1:first-of-type { margin-top: 0; }
  h2 { font-size: 1.2em; margin: 1.1em 0 0.35em; page-break-after: avoid;
       border-bottom: 1px solid #999; padding-bottom: 2px; text-align: left; }
  h3 { font-size: 1.05em; margin: 0.9em 0 0.3em; page-break-after: avoid; }
  p { margin: 0.45em 0; orphans: 2; widows: 2; }
  blockquote {
    margin: 0.6em 0 0.6em 1em; padding: 0.3em 0.8em;
    border-left: 3px solid #888; background: #f6f6f6;
    font-size: 0.95em; text-align: left;
  }
  code { font-family: "Consolas", "DejaVu Sans Mono", monospace;
         font-size: 0.88em; background: #f2f2f2; padding: 0 2px; }
  pre { background: #f2f2f2; padding: 6px 8px; overflow-x: auto;
        font-size: 0.85em; page-break-inside: avoid; }
  table { border-collapse: collapse; width: 100%; margin: 0.6em 0;
          font-size: 0.9em; page-break-inside: avoid; }
  th, td { border: 1px solid #bbb; padding: 3px 6px; text-align: left;
           vertical-align: top; }
  th { background: #eee; }
  ol, ul { margin: 0.4em 0 0.4em 1.4em; padding: 0; }
  li { margin: 0.18em 0; }
  hr { border: 0; border-top: 1px solid #aaa; margin: 1.2em 0; }
  strong { color: #000; }
</style>
